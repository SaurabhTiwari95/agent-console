name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The agent this console fronts. Push cost-capped-agent with the v0.1.0 tag before the first
# run of this workflow.
env:
  AGENT_REPO: SaurabhTiwari95/cost-capped-agent
  AGENT_REF: v0.1.0

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans every commit
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Pre-publish check (private words, IPs, emails, phones, AWS ids)
        env:
          BLOCKED_WORDS: ${{ secrets.BLOCKED_WORDS }}
        run: python scripts/prepublish_check.py
      - name: Secret scan (gitleaks, full history)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements-dev.txt

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check out cost-capped-agent
        uses: actions/checkout@v7
        with:
          repository: ${{ env.AGENT_REPO }}
          ref: ${{ env.AGENT_REF }}
          path: _deps/cost-capped-agent
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt ./_deps/cost-capped-agent
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests (no network, no Google, no Claude, no cost), coverage gate 80%
        run: pytest --cov-fail-under=80

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build (fetches cost-capped-agent from GitHub); runs as non-root
        run: |
          docker build -t agent-console:ci .
          test "$(docker run --rm --entrypoint id agent-console:ci -u)" = "10001"
      - name: Starts, indexes the sample and reports ready (demo client, no network calls)
        run: |
          docker run -d --name console -p 8000:8000 --read-only --tmpfs /tmp \
            -e ENVIRONMENT=test -e CLAUDE_CLIENT=demo -e BASE_URL=https://console.example.com \
            -e SESSION_SECRET="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" \
            -v consoledata:/data agent-console:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/readyz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/readyz | grep '"status":"ready"'
          curl -fsSI http://127.0.0.1:8000/login | grep -i "content-security-policy: default-src 'none'"
      - name: Production refuses dev login
        run: |
          ! docker run --rm -e ENVIRONMENT=production -e DEV_LOGIN_ENABLED=true \
            -e SESSION_SECRET=0123456789012345678901234567890123456789 agent-console:ci
      - name: Logs on failure
        if: failure()
        run: docker logs console || true

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: "**/*.md"
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-path .github "./**/*.md"
          fail: true

  # Auto-deploy: only for a push to main, only after every other job passed.
  deploy:
    needs: [security, test, docker, docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Trigger the Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL is not set; skipping the deploy (see docs/deploy.md)."
            exit 0
          fi
          curl -fsS -X POST --max-time 30 "$RENDER_DEPLOY_HOOK_URL" -o /dev/null
          echo "Deploy triggered on Render."
